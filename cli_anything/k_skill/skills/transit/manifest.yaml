domain: transit
description: 대중교통 (지하철, 버스, 기차, 항공편)
dependencies:
  proxy: true
  npm: []
  python: []
  env_keys: []
skills:
  subway:
    name: seoul-subway
    display_name: 서울 지하철 도착정보
    description: 실시간 지하철 도착정보
  subway-lost:
    name: subway-lost-property
    display_name: 지하철 분실물
    description: 서울교통공사 지하철 분실물 검색
  intercity-bus:
    name: intercity-bus-booking
    display_name: 시외버스 예매
    description: Tmoney 시외버스 시간표/잔여석 조회
  express-bus:
    name: express-bus-booking
    display_name: 고속버스 예매
    description: KOBUS 고속버스 시간표/잔여석 조회
  flight-search:
    name: flight-ticket-search
    display_name: 항공권 검색
    description: Google Flights 항공권 가격/일정 검색
  srt:
    name: srt-booking
    display_name: SRT 예매
    description: SRT 열차 조회/예매
  ktx:
    name: ktx-booking
    display_name: KTX 예매
    description: KTX/코레일 열차 조회/예매
  transit-route:
    name: korean-transit-route
    display_name: 대중교통 길찾기
    description: ODSay 대중교통 길찾기
  seoul-bike:
    name: seoul-bike
    display_name: 서울 따릉이
    description: 따릉이(서울 공공자전거) 대여소 위치/잔여 대수 조회
    proxy: seoul-bike
    endpoints:
      nearby: /v1/seoul-bike/nearby
      info: /v1/seoul-bike/info
      availability: /v1/seoul-bike/availability
    required_env: []
    auth_note: 프록시 경유, 별도 API 키 불필요
    examples:
      - "k-skill transit seoul-bike nearby --lat 37.5665 --lon 126.9780 -j"
      - "k-skill transit seoul-bike info --station-id ST-1001 -j"
      - "k-skill transit seoul-bike availability --lat 37.5665 --lon 126.9780 -j"
