domain: document
label: "문서"
description: "HWP, 맞춤법, 글자수, 윤문"
dependencies:
  proxy: false
  npm: []
  python: []
  env_keys: []
skills:
  hwp-convert:
    name: "hwp"
    display_name: "HWP 변환"
    description: "HWP/HWPX 문서를 PDF 등으로 변환"
    npm: ["kordoc"]
  rhwp-debug:
    name: "rhwp-advanced"
    display_name: "HWP 레이아웃 디버그"
    description: "rhwp Rust CLI로 HWP 레이아웃 디버깅"
  rhwp-edit:
    name: "rhwp-edit"
    display_name: "HWP 편집"
    description: "HWP 문서 편집 (k-skill-rhwp)"
    npm: ["k-skill-rhwp"]
  spell-check:
    name: "korean-spell-check"
    display_name: "맞춤법 검사"
    description: "한국어 맞춤법/문법 검사"
  char-count:
    name: "korean-character-count"
    display_name: "글자 수 세기"
    description: "한국어 글자/어절/문단 수 카운트"
    npm: ["korean-character-count"]
  korean-middle-korean:
    name: korean-middle-korean
    display_name: 중세 한국어 검색
    description: 중세 한국어 형태/원형/예문 검색
    runner: node
    script: scripts/korean_middle_korean_search.js
    required_env: []
    required_system: [node, npm]
    auth_note: 사전 빌드된 node 모듈 사용, API 키 불필요
    examples:
      - "k-skill document korean-middle-korean word '가다' -j"
      - "k-skill document korean-middle-korean origin '나아가다' -j"
      - "k-skill document korean-middle-korean example '사랑' -j"
  humanizer:
    name: korean-humanizer
    display_name: AI 글 윤문
    description: AI가 쓴 한국어 글을 자연스러운 사람 글로 윤문
    category: writing
    phase: v2
    runner: prompt
    required_env: []
    auth_note: 프롬프트 기반 스킬, API 키 불필요
    examples:
      - "k-skill document humanizer 'AI가 작성한 자연스럽지 않은 글'"
      - "k-skill document humanizer --length 1000 '수정할 텍스트'"
